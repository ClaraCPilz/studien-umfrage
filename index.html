<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studie</title>
<style>
:root{--page:#f4f4f1;--card:#fff;--border:#e2e2dd;--accent:#44546a;--accent-h:#36445a;--text:#2b2b2b;--muted:#6f6f6b;--error:#b3261e;--track:#dcdcd7;--dis:#d6d6d1;--input:#fbfbf9;--sel:#e9eef5;--hover:#f6f6f3;--line:#8f8f8a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
#track{height:10px;background:var(--track);flex:none}
#fill{height:100%;width:0;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
#page{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;min-height:0}
#card{background:var(--card);border:1px solid var(--border);width:840px;max-width:100%;height:min(860px,100%);padding:34px 48px;display:flex;flex-direction:column;transition:width .45s cubic-bezier(.2,.8,.2,1);overflow:hidden}
#card.wide{width:1560px}
.sec{font:600 12px "Segoe UI",sans-serif;color:var(--muted);letter-spacing:.02em}
.body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;padding:8px 0}
.body.center{justify-content:center}
.bar{display:flex;align-items:center;gap:16px;padding-top:12px;position:relative;min-height:56px}
.err{color:var(--error);flex:1;font-size:14px}
.btn{background:var(--accent);color:#fff;border:0;padding:10px 30px;font:600 18px "Segoe UI",sans-serif;cursor:pointer}
.btn:hover{background:var(--accent-h)}.btn:disabled{background:var(--dis);color:#8a8a86;cursor:default}
.ans{display:flex;gap:10px;position:absolute;left:50%;transform:translateX(-50%)}
.ans button{width:110px;border:0;padding:10px;font:600 18px "Segoe UI",sans-serif;cursor:pointer;background:var(--dis);color:var(--text)}
.ans button.on{background:var(--accent);color:#fff}.ans button:disabled{color:#8a8a86;cursor:default}
h1{font:600 24px "Segoe UI",sans-serif;text-align:center;margin:6px 0 14px}
h2{font:600 20px "Segoe UI",sans-serif;margin:8px 0 0}
.q{font:600 17px "Segoe UI",sans-serif;text-align:center}.hint{color:var(--muted);text-align:center;margin-top:6px}
.panel{background:var(--hover);border:1px solid var(--border);padding:22px 26px;margin:22px 36px 0;font-size:16px}
.txt{font-size:16px}.txt .para{margin-top:10px}.txt .para:first-child{margin-top:0}
.li{display:flex;gap:10px;margin-left:14px}.li i{font-style:normal;min-width:20px}
.choice{display:flex;align-items:center;gap:14px;border:2px solid var(--border);padding:12px 16px;margin:0 36px 10px;cursor:pointer;font-size:16px}
.choice.m{padding:9px 16px;margin-bottom:8px}.choice.c{padding:5px 16px;margin-bottom:5px;font-size:15px}
.choice:hover{background:var(--hover)}.choice.on{background:var(--sel);border-color:var(--accent)}
.box{width:24px;height:24px;border:2px solid var(--line);background:#fff;flex:none;display:grid;place-items:center;color:#fff;font-size:16px;line-height:1}
.box.r{border-radius:50%}.on .box{border-color:var(--accent)}.on .box.r{background:radial-gradient(var(--accent) 45%,#fff 50%)}.on .box.k{background:var(--accent)}
.choice input[type=text]{flex:1;font:inherit;padding:4px 8px;border:1px solid var(--border);background:var(--input)}
select,input[type=text].id{font:inherit;font-size:16px;padding:8px;border:1px solid var(--border);background:var(--input);color:var(--text)}
input.id{text-align:center;font-size:20px!important;width:300px}
.scroll{border:1px solid var(--border);background:var(--input);padding:12px 16px;overflow:auto;flex:1;font-size:16px}
.scroll h3{font:600 16px "Segoe UI",sans-serif;color:var(--accent);margin:14px 0 6px}.scroll p{margin:0 0 8px}.scroll .li{margin-bottom:3px}
.two{display:grid;grid-template-columns:640px 1fr;gap:28px;flex:1;min-height:0}
.two>div{min-height:0;display:flex;flex-direction:column}
.imgbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.imgbox img,.imgbox .ph{max-width:100%;max-height:100%;border:1px solid var(--border);object-fit:contain}
.ph{background:var(--hover);color:var(--muted);padding:40px;text-align:center}
table.ueq{width:100%;border-collapse:collapse;flex:1}
.ueq td{padding:0;text-align:center}.ueq td.l{text-align:right;padding-right:10px;width:120px}.ueq td.r{text-align:left;padding-left:10px;width:120px}
.ueq tr:nth-child(odd){background:var(--hover)}.ueq tr.bad td.l,.ueq tr.bad td.r,.sus.bad .st{color:var(--error)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;padding:0}
.dot:hover{border-color:var(--accent)}.dot.on{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,#fff 50%)}
.sus{padding:10px 16px}.sus:nth-child(even){background:var(--hover)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;font-size:12px;color:var(--muted);margin-top:4px;justify-items:center}
.cols{display:grid;gap:20px;flex:1;min-height:0}.cols>div{display:flex;flex-direction:column;min-height:0}
.lbl{font:600 14px "Segoe UI",sans-serif;color:var(--accent)}
textarea{font:inherit;padding:8px 10px;border:1px solid var(--border);background:var(--input);height:110px;margin-top:10px;resize:vertical}
.cell{border:2px solid var(--border);background:var(--hover);flex:1;display:flex;align-items:center;justify-content:center;min-height:0;font-size:28px;color:var(--muted);margin-top:4px}
.cell.over{border-color:var(--accent)}.cell img{max-width:100%;max-height:100%;cursor:grab}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
.timer{font:600 20px "Segoe UI",sans-serif;color:var(--muted)}
.area{border:1px solid var(--border);flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin-top:8px;padding:8px}
.start{text-align:center;color:var(--muted)}.start p{margin:0 0 14px}
.qline{font-size:14px;margin-top:10px}.qline:first-child{margin-top:0}
.route{display:grid;grid-template-columns:1fr 380px;gap:16px;width:100%;height:100%}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:0}
.lists>div{display:flex;flex-direction:column;min-height:0}
.lb{background:var(--hover);border:2px solid var(--border);flex:1;margin-top:4px;padding:4px 0;display:flex;flex-direction:column;overflow:auto}
.lb.over{border-color:var(--accent)}.lb small{color:var(--muted);text-align:center;margin:4px 0}
.chip{color:#fff;font:600 14px "Segoe UI",sans-serif;padding:6px 10px;margin:2px 6px;cursor:grab;text-align:left}
/* Chips haben eine feste Höhe; Listenfeld bleibt flexibel und kann bei Bedarf scrollen. */
.lb .chip{height:58px;min-height:58px;flex:0 0 58px;display:flex;align-items:center;box-sizing:border-box}
#dev{position:fixed;left:2px;bottom:2px;display:flex;gap:2px}#dev button{background:var(--dis);border:0;font-size:11px;padding:2px 7px;cursor:pointer}
@media(max-width:1100px){.two{grid-template-columns:1fr;overflow:auto}.route{grid-template-columns:1fr;overflow:auto}#card{padding:20px}}
#fullscreenGate{position:fixed;inset:0;z-index:9999;background:var(--page);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#fullscreenGate>div{max-width:560px;background:var(--card);border:1px solid var(--border);padding:36px 42px}
#fullscreenGate p{font-size:16px;color:var(--muted);margin:12px 0 22px}
</style>
</head>

<div id="page"><div id="card"></div></div>

 const nx=()=>{if(cells.slice(0,n).some(v=>v==null))return err("Bitte ziehe beide Varianten auf einen Platz.");const r=cells.slice(0,n).map(v=>S.order[v].id),o={[f.rank+"_Ranking"]:r.join(" > ")};r.forEach((id,k)=>o[`${f.rank}_Rang_${id}`]=k+1);if(ph==PHASES.length-1)o.Abschluss_Zeit=now();save(o);next()};
 $("#nx").onclick=nx;S.cur={next:nx,fill(){if(cells.slice(0,n).some(v=>v==null)){cells=S.order.map((_,i)=>i).concat(Array(n).fill(null));paint()}}}}}};
function taskSpec(t,practice,nr,v){const c=TASKS[t],s={...(practice?c.practice:c.measured)[nr-1]};s.image=practice?TASK_IMG_PRACTICE(t,nr,v.id):TASK_IMG(t,v.id,nr);s.sec=practice?c.sp:c.sm;
 s.title=practice?`Übungsaufgabe: ${c.name} - ${v.id}`:`Aufgabe: ${c.name} ${nr} - ${v.id}`;s.save=practice?null:`A${t}_${v.id}_${pad2(nr)}`;s.nr=nr;s.orderKey=`A${t}_${v.id}_Reihenfolge_Aufgaben`;return s}
const startBox=(txt)=>`<div class="start" id="sb"><p>${txt}</p><button class="btn" id="st">Start</button></div>`;
const task1Pg=sp=>({sec:sp.sec,wide:1,flow:1,noEnter:1,run(){let started=false,expired=false,ans=null,t0=0;
 shell(this,`<div class="head"><h2>${esc(sp.title)}</h2><span class="timer" id="tm">Zeit: ${TASK1_TIME_LIMIT} s</span></div><div style="margin:6px 0 10px">${sp.question.map(r=>`<div class="qline" style="font-size:16px">${runs(r.map(([t,s])=>[t,s]))}</div>`).join("")}</div><div class="area" id="ar">${startBox(`Das Bild erscheint, sobald du auf „Start“ klickst.<br>Dann laufen ${TASK1_TIME_LIMIT} Sekunden.`)}</div>`,
  {mid:`<div class="ans"><button data-a="Ja" disabled>Ja</button><button data-a="Nein" disabled>Nein</button></div>`});
 const sty=()=>card.querySelectorAll(".ans button").forEach(b=>{b.disabled=!started||expired;b.classList.toggle("on",ans==b.dataset.a)});
 card.querySelectorAll(".ans button").forEach(b=>b.onclick=()=>{if(started&&!expired){ans=b.dataset.a;err("");sty()}});
 const start=()=>{if(started)return;started=true;t0=performance.now();$("#ar").innerHTML=`<div class="imgbox" style="width:100%;height:100%">${img(sp.image)}</div>`;sty();
  S.timer=setInterval(()=>{const rem=TASK1_TIME_LIMIT-(performance.now()-t0)/1000;if(rem<=0){clearInterval(S.timer);expired=true;$("#tm").textContent="Zeit abgelaufen";$("#tm").style.color="var(--error)";err("Die Zeit ist abgelaufen. Klicke auf „Weiter“, um fortzufahren.");sty()}else{$("#tm").textContent=`Zeit: ${Math.ceil(rem)} s`;$("#tm").style.color=rem<=5?"var(--error)":"var(--accent)"}},100)};
 $("#st").onclick=start;
 const nx=()=>{if(!started)return err("Bitte starte die Aufgabe mit „Start“.");if(!expired&&ans==null)return err("Bitte wähle „Ja“ oder „Nein“, bevor du auf „Weiter“ klickst.");
  const ms=Math.round(performance.now()-t0),given=expired?"":ans;clearInterval(S.timer);
  if(sp.save){const o={[sp.save+"_Antwort"]:given,[sp.save+"_Zeit_ms"]:ms,[sp.save+"_Status"]:expired?"Zeit abgelaufen":"rechtzeitig",[sp.orderKey]:orderValue(sp.orderKey,sp.nr)};if(sp.correct)o[sp.save+"_Richtig"]=given==sp.correct?1:0;save(o)}next()};
 $("#nx").onclick=nx;S.cur={next:nx,fill(){start();if(!expired&&ans==null){ans="Ja";sty()}}}}});
const task2Pg=sp=>({sec:sp.sec,wide:1,flow:1,noEnter:1,run(){let started=false,t0=0,pool=sp.lines.map((_,i)=>i),rank=[];
 shell(this,`<div class="head"><h2>${esc(sp.title)}</h2><span class="timer" id="tm">Zeit: 0:00</span></div><div class="cols" style="grid-template-columns:1fr 1fr;flex:none;margin:10px 0 8px;font-size:16px"><div><div>${runs(sp.headline)}</div><div style="margin-top:10px">${bold(sp.textLeft)}</div></div><div>${esc(sp.text)}</div></div><div class="area" id="ar">${startBox("Das Bild und die Linien erscheinen, sobald du auf „Start“ klickst.<br>Die Zeit wird gemessen, bis du auf „Weiter“ klickst.")}</div>`);
 const render=()=>{const chip=i=>`<div class="chip" draggable="true" data-i="${i}" style="background:${sp.lines[i][1]}">${esc(sp.lines[i][0])}</div>`;
  $("#pool").innerHTML=pool.map(chip).join("");$("#rank").innerHTML=`<small>▲ oben: Startlinie</small>${rank.map(chip).join("")}<small style="margin-top:auto">▼ unten: Linie zum Ziel</small>`;
  document.querySelectorAll(".chip").forEach(c=>{const i=+c.dataset.i;c.ondragstart=e=>e.dataTransfer.setData("text",i);c.ondblclick=()=>toggle(i)})};
 const toggle=i=>{if(pool.includes(i)){if(rank.length>=ROUTE_MAX_LINES)return err(`Bitte wähle maximal ${ROUTE_MAX_LINES} Linien.`);pool=pool.filter(x=>x!=i);rank.push(i)}else{rank=rank.filter(x=>x!=i);pool.push(i);pool.sort((a,b)=>a-b)}err("");render()};
 const start=()=>{if(started)return;started=true;err("");t0=performance.now();
  $("#ar").innerHTML=`<div class="route"><div class="imgbox">${img(sp.image)}</div><div class="lists"><div><div class="lbl">${ROUTE_POOL_TITLE}</div><div class="lb" id="pool"></div></div><div><div class="lbl">${ROUTE_RANK_TITLE}</div><div class="lb" id="rank"></div></div></div></div>`;
  [["pool"],["rank"]].forEach(([k])=>{const b=$("#"+k);b.ondragover=e=>{e.preventDefault();b.classList.add("over")};b.ondragleave=()=>b.classList.remove("over");
   b.ondrop=e=>{e.preventDefault();b.classList.remove("over");const i=+e.dataTransfer.getData("text");if(k=="rank"){if(!rank.includes(i)&&rank.length>=ROUTE_MAX_LINES)return err(`Bitte wähle maximal ${ROUTE_MAX_LINES} Linien.`);
     const others=rank.filter(x=>x!=i),pos=others.filter(x=>{const r=document.querySelector(`#rank .chip[data-i="${x}"]`).getBoundingClientRect();return r.top+r.height/2<e.clientY}).length;pool=pool.filter(x=>x!=i);others.splice(pos,0,i);rank=others;err("")}
    else if(rank.includes(i)){rank=rank.filter(x=>x!=i);pool.push(i);pool.sort((a,b)=>a-b)}render()}});
  render();S.timer=setInterval(()=>{const s=Math.floor((performance.now()-t0)/1000);$("#tm").textContent=`Zeit: ${Math.floor(s/60)}:${pad2(s%60)}`;$("#tm").style.color="var(--accent)"},200)};
 $("#st").onclick=start;
 const nx=()=>{if(!started)return err("Bitte starte die Aufgabe mit „Start“.");if(!rank.length)return err("Bitte ziehe mindestens eine Linie in die rechte Liste.");
  const ms=Math.round(performance.now()-t0);clearInterval(S.timer);const names=rank.map(i=>sp.lines[i][0]);
  if(sp.save){const o={[sp.save+"_Reihenfolge"]:names.join(" > "),[sp.save+"_Zeit_ms"]:ms,[sp.orderKey]:orderValue(sp.orderKey,sp.nr)};if(sp.correct)o[sp.save+"_Richtig"]=names.join()==sp.correct.join()?1:0;save(o)}next()};
 $("#nx").onclick=nx;S.cur={next:nx,fill(){start();if(!rank.length)toggle(pool[0])}}}});
const excludedPg=()=>({sec:SEC.end,run(){shell(this,`<h1>Vielen Dank für dein Interesse!</h1><div class="panel txt">${rich("Da die Studie Aufgaben mit farbigen Linien enthält, können Personen mit bekannter Farbsehschwäche oder Farbenblindheit leider nicht teilnehmen.\n\nDeine bisherigen Angaben werden nicht weiter verwendet.")}</div>`,{center:1,btn:"Beenden"});$("#nx").onclick=()=>{card.innerHTML="<h1 style='margin:auto'>Du kannst dieses Fenster jetzt schließen.</h1>"}}});
const donePg=()=>({sec:SEC.end,run(){shell(this,`<h1>Vielen Dank!</h1><div style="text-align:center;font-size:16px;color:var(--muted)">Deine Angaben wurden gespeichert.<br>(Hier folgen später die weiteren Teile der Studie.)</div><div style="text-align:center;margin-top:24px"><button class="btn" id="dl">CSV-Datei herunterladen</button></div>`,{center:1,btn:"Beenden"});
 $("#dl").onclick=download;download();$("#nx").onclick=()=>{card.innerHTML="<h1 style='margin:auto'>Du kannst dieses Fenster jetzt schließen.</h1>"}}});

// ===== Ablauf =====
function flow(t){const P=[],c=TASKS[t],nm=c.measured.length,Page=t==1?task1Pg:task2Pg;
 S.order.forEach((v,k)=>P.push(Page(taskSpec(t,true,k+1,v))));
 const ann=(a,k)=>textPg(c.sm,a[0],a[1].replace("{n}",numw(nm)).replace("{ordinal}",ORDINALS[k]));
 P.push(ann(MEASURE_START,0));
 S.order.forEach((v,vi)=>{for(let nr=1;nr<=nm;nr++)P.push(Page(taskSpec(t,false,nr,v)));if(vi<S.order.length-1)P.push(ann(NEXT_VARIANT,vi+1))});
 return P}
function phase(ph){const f=PHASES[ph],P=[textPg(f.sec,f.introTitle,f.intro,()=>{if(ph==0&&RANDOMIZE_VARIANT_ORDER){/* Reihenfolge wird bei build() gesetzt */}orderSave(ph)()})];
 S.order.forEach((_,pos)=>{P.push(ratingPg(ph,pos));if(f.sus)P.push(susPg(ph,pos))});P.push(commentPg(ph),rankPg(ph));return P}
function build(){if(RANDOMIZE_VARIANT_ORDER)S.order.sort(()=>Math.random()-.5);
 const saveOrder=t=>()=>save({[`A${t}_Reihenfolge_Varianten`]:S.order.map(v=>v.id).join(" > ")});
 S.pages=[idPg(),privPg(),textPg(SEC.base,DEMO_TITLE,DEMO_TEXT),...QUESTIONS.map(qPg),...phase(0),
  textPg(SEC.tasks,TASK_INTRO_TITLE,TASK_INTRO_TEXT),textPg(SEC.p1,PRACTICE_TITLE,PRACTICE_TEXT,saveOrder(1)),...flow(1),
  textPg(SEC.p2,PRACTICE2_TITLE,PRACTICE2_TEXT,saveOrder(2)),...flow(2),...phase(1),donePg()]}
build();S.i=null;
// Vollbild muss durch eine bewusste Nutzeraktion gestartet werden.
const gate=document.createElement("div");gate.id="fullscreenGate";
gate.innerHTML=`<div><h1>Studie im Vollbild starten</h1><p>Für die bestmögliche Darstellung wird die Studie im Vollbild geöffnet. Klicke auf „Studie starten“, um fortzufahren.</p><button class="btn" id="fullscreenStart">Studie starten</button><p style="font-size:13px;margin-bottom:0">Du kannst den Vollbildmodus jederzeit mit Esc verlassen.</p></div>`;
document.body.appendChild(gate);
$("#fullscreenStart").addEventListener("click",async()=>{
  try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){/* Browser verweigert Vollbild: Studie trotzdem starten */}
  gate.remove();goto(0,false);
});
</script>
