<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<title>Studie</title>
<style>
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
:root{--page:#f4f4f1;--card:#fff;--border:#e2e2dd;--accent:#44546a;--accent-h:#36445a;--text:#2b2b2b;--muted:#6f6f6b;--error:#b3261e;--track:#dcdcd7;--dis:#d6d6d1;--input:#fbfbf9;--sel:#e9eef5;--hover:#f6f6f3;--line:#8f8f8a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
#track{height:10px;background:var(--track);flex:none}
#fill{height:100%;width:0;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
#page{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;min-height:0}
#card{background:var(--card);border:1px solid var(--border);width:840px;max-width:100%;height:min(860px,100%);padding:34px 48px;display:flex;flex-direction:column;transition:width .45s cubic-bezier(.2,.8,.2,1);overflow:hidden}
#card.wide{width:1560px}
.sec{font:600 12px "Segoe UI",sans-serif;color:var(--muted);letter-spacing:.02em}
.body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;padding:8px 0}
.body.center{justify-content:center}
.bar{display:flex;align-items:center;gap:16px;padding-top:12px;position:relative;min-height:56px}
.err{color:var(--error);flex:1;font-size:14px}
.btn{background:var(--accent);color:#fff;border:0;padding:10px 30px;font:600 18px "Segoe UI",sans-serif;cursor:pointer}
.btn:hover{background:var(--accent-h)}.btn:disabled{background:var(--dis);color:#8a8a86;cursor:default}
.ans{display:flex;gap:10px;position:absolute;left:50%;transform:translateX(-50%)}
.ans button{width:110px;border:0;padding:10px;font:600 18px "Segoe UI",sans-serif;cursor:pointer;background:var(--dis);color:var(--text)}
.ans button.on{background:var(--accent);color:#fff}.ans button:disabled{color:#8a8a86;cursor:default}
h1{font:600 24px "Segoe UI",sans-serif;text-align:center;margin:6px 0 14px}
h2{font:600 20px "Segoe UI",sans-serif;margin:8px 0 0}
.q{font:600 17px "Segoe UI",sans-serif;text-align:center}.hint{color:var(--muted);text-align:center;margin-top:6px}
.panel{background:var(--hover);border:1px solid var(--border);padding:22px 26px;margin:22px 36px 0;font-size:16px}
.txt{font-size:16px}.txt .para{margin-top:10px}.txt .para:first-child{margin-top:0}
.li{display:flex;gap:10px;margin-left:14px}.li i{font-style:normal;min-width:20px}
.choice{display:flex;align-items:center;gap:14px;border:2px solid var(--border);padding:12px 16px;margin:0 36px 10px;cursor:pointer;font-size:16px}
.choice.m{padding:9px 16px;margin-bottom:8px}.choice.c{padding:5px 16px;margin-bottom:5px;font-size:15px}
.choice:hover{background:var(--hover)}.choice.on{background:var(--sel);border-color:var(--accent)}
.box{width:24px;height:24px;border:2px solid var(--line);background:#fff;flex:none;display:grid;place-items:center;color:#fff;font-size:16px;line-height:1}
.box.r{border-radius:50%}.on .box{border-color:var(--accent)}.on .box.r{background:radial-gradient(var(--accent) 45%,#fff 50%)}.on .box.k{background:var(--accent)}
.choice input[type=text]{flex:1;font:inherit;padding:4px 8px;border:1px solid var(--border);background:var(--input)}
select,input[type=text].id,input[type=password].id{font:inherit;font-size:16px;padding:8px;border:1px solid var(--border);background:var(--input);color:var(--text)}
input.id{text-align:center;font-size:20px!important;width:300px}
.scroll{border:1px solid var(--border);background:var(--input);padding:12px 16px;overflow-y:scroll;overflow-x:hidden;flex:1;font-size:16px}
/* Scrollbalken dauerhaft sichtbar (auch auf dem Mac, wo Balken sonst erst beim Scrollen erscheinen) */
.scroll::-webkit-scrollbar,.vs::-webkit-scrollbar,.body::-webkit-scrollbar{width:14px}
.scroll::-webkit-scrollbar-track,.vs::-webkit-scrollbar-track,.body::-webkit-scrollbar-track{background:var(--track)}
.scroll::-webkit-scrollbar-thumb,.vs::-webkit-scrollbar-thumb,.body::-webkit-scrollbar-thumb{background:var(--line);border:3px solid var(--track);border-radius:8px}
.scroll::-webkit-scrollbar-thumb:hover,.vs::-webkit-scrollbar-thumb:hover,.body::-webkit-scrollbar-thumb:hover{background:var(--accent)}
@supports not selector(::-webkit-scrollbar){.scroll,.vs,.body{scrollbar-width:auto;scrollbar-color:var(--line) var(--track)}}
.cons.locked{opacity:.45;cursor:not-allowed}.cons.locked:hover{background:transparent}
#scrollhint{text-align:center;font-size:14px;color:var(--muted);margin:8px 0 0}
.dplink{color:var(--accent);font-weight:600}
.scroll h3{font:600 16px "Segoe UI",sans-serif;color:var(--accent);margin:14px 0 6px}.scroll p{margin:0 0 8px}.scroll .li{margin-bottom:3px}
.two{display:grid;grid-template-columns:minmax(440px,1fr) 2fr;gap:28px;flex:1;min-height:0}
.two>div{min-height:0;display:flex;flex-direction:column}
.imgbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.imgbox img,.imgbox .ph{max-width:100%;max-height:100%;border:1px solid var(--border);object-fit:contain}
.ph{background:var(--hover);color:var(--muted);padding:40px;text-align:center}
table.ueq{width:100%;border-collapse:collapse;flex:1}
.ueq td{padding:0;text-align:center}.ueq td.l{text-align:right;padding-right:10px;width:105px}.ueq td.r{text-align:left;padding-left:10px;width:105px}
.ueq tr:nth-child(odd){background:var(--hover)}.ueq tr.bad td.l,.ueq tr.bad td.r,.sus.bad .st{color:var(--error)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;padding:0}
.dot:hover{border-color:var(--accent)}.dot.on{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,#fff 50%)}
.sus{padding:8px 16px}.sus:nth-child(even){background:var(--hover)}
.scale{display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;color:var(--muted);margin:6px auto 0;max-width:520px}.scale .lo,.scale .hi{flex:1;line-height:1.2}.scale .lo{text-align:right}.scale .hi{text-align:left}.scale .dots{display:grid;grid-template-columns:repeat(5,34px);text-align:center;justify-items:center;flex:none}
.cols{display:grid;gap:20px;flex:1;min-height:0}.cols>div{display:flex;flex-direction:column;min-height:0}
.lbl{font:600 14px "Segoe UI",sans-serif;color:var(--accent)}
textarea{font:inherit;padding:8px 10px;border:1px solid var(--border);background:var(--input);height:180px;margin-top:10px;resize:vertical}
.cell{border:2px solid var(--border);background:var(--hover);flex:1;display:flex;align-items:center;justify-content:center;min-height:0;font-size:28px;color:var(--muted);margin-top:4px}
.cell.over{border-color:var(--accent)}
.cols>.pick{border:3px solid var(--border);background:var(--hover);cursor:pointer;padding:8px;min-height:0}.cols>.pick:hover{border-color:var(--line)}.cols>.pick.sel{border-color:var(--accent);background:var(--sel)}.cell img{max-width:100%;max-height:100%;cursor:grab}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
.timer{font:600 20px "Segoe UI",sans-serif;color:var(--muted)}
.area{border:1px solid var(--border);flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin-top:8px;padding:8px}
.start{text-align:center;color:var(--muted)}.start p{margin:0 0 14px}
.qline{font-size:14px;margin-top:10px}.qline:first-child{margin-top:0}
.route{display:grid;grid-template-columns:1fr 380px;gap:16px;width:100%;height:100%}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:0}
.lists>div{display:flex;flex-direction:column;min-height:0}
.lb{background:var(--hover);border:2px solid var(--border);flex:1;margin-top:4px;padding:4px 0;display:flex;flex-direction:column;overflow:auto}
.lb.over{border-color:var(--accent)}.lb small{color:var(--muted);text-align:center;margin:4px 0}
.chip{color:#fff;font:600 14px "Segoe UI",sans-serif;padding:6px 10px;margin:2px 6px;cursor:grab;text-align:left}
/* Chips teilen sich die verfügbare Höhe (max. 42px, min. 26px), damit nicht gescrollt werden muss. */
.lb .chip{height:auto;min-height:26px;max-height:45px;flex:1 1 0;display:flex;align-items:center;box-sizing:border-box}
#abortBtn{position:fixed;left:12px;bottom:12px;z-index:9000;background:#fff;color:var(--error);border:1px solid var(--error);padding:6px 14px;font:600 13px "Segoe UI",sans-serif;cursor:pointer}
#abortBtn:hover{background:var(--error);color:#fff}
#abortModal{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px}
#abortModal>div{max-width:540px;background:var(--card);border:1px solid var(--border);padding:32px 38px;text-align:center}
#abortModal p{font-size:16px;margin:12px 0 22px}
#abortModal .row{display:flex;gap:12px;justify-content:center}
#abortModal .btn.sec{background:var(--dis);color:var(--text)}
#abortModal .btn.danger{background:var(--error)}
#dev{position:fixed;left:170px;bottom:2px;display:flex;gap:2px}#dev button{background:var(--dis);border:0;font-size:11px;padding:2px 7px;cursor:pointer}
@media(max-width:1100px){.two{grid-template-columns:1fr;overflow:auto}.route{grid-template-columns:1fr;overflow:auto}#card{padding:20px}}
#fullscreenGate,#envBlock{position:fixed;inset:0;z-index:9999;background:var(--page);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#fullscreenGate>div,#envBlock>div{max-width:560px;background:var(--card);border:1px solid var(--border);padding:36px 42px}
#fullscreenGate p,#envBlock p{font-size:16px;color:var(--muted);margin:12px 0 22px}
</style>
</head>
<body>
<div id="track"><div id="fill"></div></div>
<div id="page"><div id="card"></div></div>

<script>

 :{key:"Fachbereich",type:"dropdown",otherText:true,text:"Welchem Fach- oder Tätigkeitsbereich würdest du dich am ehesten zuordnen?",options:["Naturwissenschaften","Ingenieurwissenschaften & Technik","Medizin, Gesundheit & Lebenswissenschaften","Sozialwissenschaften","Wirtschafts- & Rechtswissenschaften","Geisteswissenschaften","Bildungswissenschaften & Psychologie","Kunst, Design & Medien","Sonstiges"]};

{key:"Altersgruppe",type:"dropdown",text:"Wie alt bist du?",options:["unter 18 Jahre","18–24 Jahre","25–34 Jahre","35–44 Jahre","45–54 Jahre","55–64 Jahre","65 Jahre oder älter"]},

let TASK_CONFIG=null;
async function loadTaskConfig(){
 if(TASK_CONFIG)return TASK_CONFIG;
 const r=await fetch("aufgaben.json",{cache:"no-store"});
 if(!r.ok)throw new Error("aufgaben.json konnte nicht geladen werden (HTTP "+r.status+").");
 const cfg=await r.json();
 if(!cfg||!cfg.varianten||!cfg.varianten.A||!cfg.varianten.B)throw new Error("In aufgaben.json fehlen die Varianten A und/oder B.");
 for(const t of [1,2]){
  for(const v of ["A","B"]){
   const x=cfg.varianten[v].aufgabentypen&&cfg.varianten[v].aufgabentypen[String(t)];
   if(!x||!Array.isArray(x.uebungen)||!Array.isArray(x.aufgaben)||!x.aufgaben.length)throw new Error("Aufgabentyp "+t+" für Variante "+v+" ist unvollständig.");
   if(t===1){for(const q of [...x.uebungen,...x.aufgaben])if(!LINES[q.linie_1]||!LINES[q.linie_2]||!Number.isFinite(Number(q.mindestens_gemeinsame_stationenzahl)))throw new Error("Ungültige Linienangabe in Aufgabe 1, Variante "+v+".");}
   if(t===2){if(!Array.isArray(x.linien)||!x.linien.length)throw new Error("Linienliste in Aufgabe 2, Variante "+v+" fehlt.");for(const q of [...x.uebungen,...x.aufgaben]){if(!LINES[q.ausgefallene_linie])throw new Error("Ungültige ausgefallene Linie in Aufgabe 2, Variante "+v+".");if(!(q.startstation||x.startstation)||!(q.zielstation||x.zielstation))throw new Error("Start- oder Zielstation fehlt in Aufgabe 2, Variante "+v+", Aufgabe "+q.id+".");}}
  }
 }
 for(const t of [1,2])if(cfg.varianten.A.aufgabentypen[String(t)].aufgaben.length!==cfg.varianten.B.aufgabentypen[String(t)].aufgaben.length)throw new Error("Variante A und B müssen bei Aufgabentyp "+t+" dieselbe Anzahl an Aufgaben enthalten, weil die Teilnehmenden-Zuordnung feste Aufgabenpositionen verwendet.");
 TASK_CONFIG=cfg;
 for(const t of [1,2]){const a=cfg.varianten.A.aufgabentypen[String(t)];TASKS[t].practice=a.uebungen;TASKS[t].measured=a.aufgaben;TASKS[t].name=a.name||TASKS[t].name;}
 return TASK_CONFIG;
}

const SAVE_ENDPOINT="https://umfrage-speicher.claracamilla-pilz2.workers.dev/";
const SAVE_INTERVAL_MS=5*60*1000; // Automatische Sammelspeicherung alle 5 Minuten
let savePromise=null,saveDirty=false,autoSaveTimer=null;
function makeSaveBody(){
 const d={...S.data,...derived(S.data)},cols=columns();
 const all=cols.concat(Object.keys(S.data).filter(k=>!cols.includes(k)));
 const values={};all.forEach(k=>values[k]=d[k]===undefined?"":d[k]);
 return JSON.stringify({id:S.data.ID,pw:S.pw,columns:all,values});
}
// Antworten werden sofort im Arbeitsspeicher aktualisiert, aber gebündelt übertragen.
function save(vals,options={}){
 if(S.wiped)return Promise.resolve(true);
 Object.assign(S.data,vals);
 if(!S.data.ID||!S.data.Datenschutz_zugestimmt)return Promise.resolve(true);
 saveDirty=true;
 return options.immediate?flushSave():Promise.resolve(true);
}
async function flushSave(){
 if(S.wiped)return true;
 if(!S.data.ID||!S.data.Datenschutz_zugestimmt||!saveDirty)return !S.saveFail;
 if(savePromise)return savePromise;
 savePromise=(async()=>{
  while(saveDirty){
   if(navigator.onLine===false){S.saveFail=true;return false}
   saveDirty=false;
   const body=makeSaveBody();let saved=false;
   for(let a=0;a<=GUARD.SAVE_RETRIES;a++){
    try{
     const r=await fetch(SAVE_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body});
     if(!r.ok)throw new Error("HTTP "+r.status+" "+(await r.text()));
     saved=true;break;
    }catch(e){
     console.error("Speichern fehlgeschlagen (Versuch "+(a+1)+"):",e);
     if(a<GUARD.SAVE_RETRIES)await new Promise(r=>setTimeout(r,1500*(a+1)));
    }
   }
   if(!saved){saveDirty=true;S.saveFail=true;S.data.Speicherfehler=(+S.data.Speicherfehler||0)+1;return false}
   S.saveFail=false;
  }
  return true;
 })();
 try{return await savePromise}finally{savePromise=null}
}
function startAutoSave(){
 if(autoSaveTimer)return;
 autoSaveTimer=setInterval(()=>{if(saveDirty&&navigator.onLine!==false)flushSave()},SAVE_INTERVAL_MS);
}
window.addEventListener("online",()=>{if(saveDirty)flushSave()});

     const others=rank.filter(x=>x!=i),pos=others.filter(x=>{const r=document.querySelector(`#rank .chip[data-i="${x}"]`).getBoundingClientRect();return r.top+r.height/2<e.clientY}).length;pool=pool.filter(x=>x!=i);others.splice(pos,0,i);rank=others;err("")}
    else if(rank.includes(i)){rank=rank.filter(x=>x!=i);pool.push(i);pool.sort((a,b)=>a-b)}render()}});
  render();S.timer=setInterval(()=>{const s=Math.floor((performance.now()-t0)/1000);$("#tm").textContent=`Zeit: ${Math.floor(s/60)}:${pad2(s%60)}`;$("#tm").style.color="var(--accent)"},200)};
 $("#st").onclick=start;
 const nx=()=>{if(!started)return err("Bitte starte die Aufgabe mit „Start“.");if(!rank.length)return err("Bitte ziehe mindestens eine Linie in die rechte Liste.");
  const ms=Math.round(performance.now()-t0);clearInterval(S.timer);const names=rank.map(i=>sp.lines[i][0]);
  if(sp.save){const o={[sp.save+"_Reihenfolge"]:names.join(" > "),[sp.save+"_Zeit_ms"]:ms,[sp.orderKey]:orderValue(sp.orderKey,sp.nr)};if(sp.correct)o[sp.save+"_Richtig"]=names.join()==sp.correct.join()?1:0;save(o)}next()};
 $("#nx").onclick=nx;S.cur={next:nx,fill(){start();if(!rank.length)toggle(pool[0])}}}});
const excludedPg=()=>({sec:SEC.end,run(){abortBtn.style.display="none";shell(this,`<h1>Vielen Dank für dein Interesse!</h1><div class="panel txt">${rich("Da die Studie Aufgaben mit farbigen Linien enthält, können Personen mit bekannter Farbsehschwäche oder Farbenblindheit leider nicht teilnehmen.\n\nDeine bisherigen Angaben werden nicht weiter verwendet.")}</div>`,{center:1,btn:"Beenden"});$("#nx").onclick=()=>{card.innerHTML="<h1 style='margin:auto'>Du kannst dieses Fenster jetzt schließen.</h1>"}}});
const DONE_TEXT="Du hast die Studie abgeschlossen. Deine Angaben wurden erfolgreich gespeichert.\n\nWir freuen uns sehr, dass du dir die Zeit genommen hast, an unserer Studie teilzunehmen. Deine Unterstützung ist ein wertvoller Beitrag zu unserem Forschungsprojekt.\n\nBei Fragen zur Studie oder Interesse an den Ergebnissen der abschließenden Auswertung kannst du dich gerne per E-Mail an **kontakt.vesbastudie26@gmail.com** wenden.";
const donePg=()=>({sec:SEC.end,run(){abortBtn.style.display="none";shell(this,`<h1>Vielen Dank für deine Teilnahme!</h1><div class="txt" style="max-width:640px;margin:0 auto"><div id="st" style="text-align:center;color:var(--muted)">Deine Angaben werden gespeichert …</div><div id="thx" style="display:none">${rich(DONE_TEXT)}</div></div>`,{center:1,btn:"Beenden"});
 $("#nx").disabled=true;
 const status=$("#st"),btn=$("#nx");
 const finishSave=async()=>{btn.disabled=true;const ok=await flushSave();if(ok){status.style.display="none";$("#thx").style.display="";btn.textContent="Beenden";btn.disabled=false;btn.onclick=()=>{card.innerHTML="<h1 style='margin:auto'>Du kannst dieses Fenster jetzt schließen.</h1>"}}else{status.innerHTML="<b style='color:#b00020'>Die Daten konnten noch nicht übertragen werden.</b><br>Bitte prüfe deine Internetverbindung und versuche es erneut. Deine Antworten bleiben bis zum Schließen dieses Fensters im Arbeitsspeicher.";btn.textContent="Erneut speichern";btn.disabled=false;btn.onclick=finishSave}};
 finishSave();}});

// ===== Ablauf =====
const V=ids=>[...ids].map(x=>VARIANTS.find(v=>v.id==x));
const withOrd=(pages,ord)=>{pages.forEach(p=>p.ord=ord);return pages};
function flow(t,pl){const P=[],c=TASKS[t],nm=c.measured.length,Page=t==1?task1Pg:task2Pg,vo=V(pl.v[t]);
 vo.forEach((v,k)=>{const pg=Page(taskSpec(t,true,1,v));pg.info=`${c.name} · Variante ${v.id} · Übungsaufgabe ${k+1}`;P.push(pg)});
 const ann=(a,k)=>textPg(c.sm,a[0],a[1].replace("{n}",String(nm)).replace("{ordinal}",ORDINALS[k]),undefined,undefined,MEASURE_PAUSE_SECONDS);
 P.push(ann(MEASURE_START[t],0));
 vo.forEach((v,vi)=>{const seq=(pl.o[t+v.id]||Array.from({length:nm},(_,i)=>i+1));seq.forEach((nr,pos)=>{const pg=Page(taskSpec(t,false,nr,v,pos+1));pg.info=`${c.name} · Variante ${v.id} · Aufgabe Nr. ${nr} (Position ${pos+1}/${nm})`;P.push(pg)});if(vi<vo.length-1)P.push(ann(NEXT_VARIANT[t],vi+1))});
 return withOrd(P,vo)}
function phase(ph,ord){const f=PHASES[ph],P=[textPg(f.sec,f.introTitle,f.intro,orderSave(ph))];
 ord.forEach((_,pos)=>{P.push(ratingPg(ph,pos));if(f.sus)P.push(susPg(ph,pos))});P.push(commentPg(ph),rankPg(ph));return withOrd(P,ord)}
function makePages(pl){
 const saveOrder=t=>()=>save({[`A${t}_Reihenfolge_Varianten`]:S.order.map(v=>v.id).join(" > ")});
 const intro=t=>{const p=t==1?textPg(SEC.p1,PRACTICE_TITLE,PRACTICE_TEXT,saveOrder(1),undefined,PRACTICE_PAUSE_SECONDS):textPg(SEC.p2,PRACTICE2_TITLE,PRACTICE2_TEXT,saveOrder(2),undefined,PRACTICE_PAUSE_SECONDS);p.ord=V(pl.v[t]);return p};
 return [idPg(),privPg(),textPg(SEC.base,DEMO_TITLE,DEMO_TEXT),...QUESTIONS.map(qPg),...phase(0,V(pl.p[0])),
  textPg(SEC.tasks,TASK_INTRO_TITLE,TASK_INTRO_TEXT),...pl.t.flatMap(t=>[intro(t),...flow(t,pl)]),...phase(1,V(pl.p[1])),donePg()]}
S.pages=[idPg()];S.i=null; // Aufgabenliste wird erst nach der ID-Eingabe gebaut (nach dem Laden von aufgaben.json)
// ===== Absicherung: Gerät, Fenster, Vollbild, Zeitlimit =====
const isMobileDevice=()=>{const ua=navigator.userAgent||"",d=navigator.userAgentData;
 // Touchscreen-Laptops sollen NICHT blockiert werden: keine Pointer-/Touch-Heuristik außer dem iPad-Fall (iPadOS meldet sich als Mac).
 if(d&&d.mobile===true)return true;
 return /Android|iPhone|iPad|iPod|Mobile|Silk|Tablet/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)};
// ===== Zoom unterbinden (Pinch, Trackpad-Geste, Strg/Cmd + Mausrad, Strg/Cmd +/-/0) =====
["gesturestart","gesturechange","gestureend"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener("wheel",e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&["+","-","=","0","_"].includes(e.key))e.preventDefault()});
const envState=()=>isMobileDevice()?"mobile":(innerWidth<GUARD.MIN_WIDTH||innerHeight<GUARD.MIN_HEIGHT)?"small":"";
const bump=k=>{if(S.ignoreLeave)return;if(S.data&&S.data.ID)S.data[k]=(+S.data[k]||0)+1};
function abortStudy(reason,text){if(S.aborted||S.finished)return true;S.aborted=S.finished=true;clearInterval(S.timer);S.enter=null;S.cur=null;ovHide();abortBtn.style.display="none";
 save({Abbruch_Grund:reason,Abbruch_Zeit:now(),Gesamtdauer_s:Math.round((Date.now()-S.t0)/1000)});flushSave();
 card.className="";card.innerHTML=`<h1>Die Studie wurde beendet</h1><div class="panel txt">${rich(text+"\n\nBitte wende dich an "+GUARD.CONTACT+".")}</div>`;return true}
function guardTick(){if(!S.active||S.finished||S.dev)return false;const t=Date.now();
 if(t-S.t0>GUARD.MAX_TOTAL_MIN*60000)return abortStudy("Zeitlimit","Die maximale Bearbeitungsdauer von "+GUARD.MAX_TOTAL_MIN+" Minuten wurde überschritten. Die Studie muss an einem Stück bearbeitet werden.");
 if(t-S.last>GUARD.MAX_IDLE_MIN*60000)return abortStudy("Inaktivität","Es gab über "+GUARD.MAX_IDLE_MIN+" Minuten keine Eingabe. Die Studie muss ohne längere Pausen bearbeitet werden.");
 return false}
const ov=document.createElement("div");ov.id="envBlock";let ovKind="";
function ovHide(){ovKind="";ov.remove()}
function envCheck(){if(!S.active||S.finished||S.dev)return ovHide();
 const e=envState(),kind=e=="mobile"?"mobile":e=="small"?"small":(S.fsOk&&!document.fullscreenElement)?"fs":"";
 if(!kind)return ovHide();if(kind==ovKind)return;ovKind=kind;
 bump(kind=="fs"?"Vollbild_verlassen":"Fenster_zu_klein");
 ov.innerHTML=kind=="fs"?`<div><h1>Vollbild wurde verlassen</h1><p>Bitte kehre zum Vollbildmodus zurück, um die Studie fortzusetzen.</p><button class="btn" id="fsBack">Vollbild aktivieren</button></div>`
  :`<div><h1>Fenster zu klein</h1><p>Bitte vergrößere das Browserfenster, um die Studie fortzusetzen. Die Studie ist nur an einem Computer bearbeitbar.</p></div>`;
 document.body.appendChild(ov);const b=ov.querySelector("#fsBack");if(b)b.onclick=async()=>{try{await document.documentElement.requestFullscreen()}catch(e){}envCheck()}}
function startGuards(){if(S.guardsOn)return;S.guardsOn=true;
 const act=()=>{S.last=Date.now()};["pointerdown","pointermove","keydown","wheel","touchstart"].forEach(ev=>document.addEventListener(ev,act,{passive:true}));
 setInterval(()=>{guardTick();envCheck()},10000);
 document.addEventListener("visibilitychange",()=>{if(document.hidden){if(S.active&&!S.finished)bump("Fokus_verloren")}else{guardTick();envCheck()}});
 window.addEventListener("blur",()=>{if(S.active&&!S.finished&&!document.hidden)bump("Fokus_verloren")});
 window.addEventListener("resize",envCheck);document.addEventListener("fullscreenchange",envCheck);
}
// ===== Manueller Abbruch mit Löschung der Daten =====
const abortBtn=document.createElement("button");
abortBtn.id="abortBtn";abortBtn.textContent="Studie abbrechen";abortBtn.style.display="none";
document.body.appendChild(abortBtn);
const showAbortBtn=()=>{abortBtn.style.display=""};

abortBtn.onclick=()=>{
 if(S.finished||S.aborted||document.getElementById("abortModal"))return;
 const m=document.createElement("div");m.id="abortModal";
 m.innerHTML=`<div><h1>Studie abbrechen?</h1><p id="abMsg">Wenn du abbrichst, werden <b>alle bisher gespeicherten Daten gelöscht</b>. Es bleibt nur der Vermerk, dass die Studie manuell abgebrochen wurde. Eine erneute Teilnahme ist anschließend nicht möglich.</p><div class="row"><button class="btn sec" id="abNo">Zurück zur Studie</button><button class="btn danger" id="abYes">Abbrechen und Daten löschen</button></div></div>`;
 document.body.appendChild(m);
 $("#abNo").focus();
 $("#abNo").onclick=()=>m.remove();
 $("#abYes").onclick=()=>wipeAndAbort(m);
};

async function wipeAndAbort(m){
 const msg=$("#abMsg"),yes=$("#abYes"),no=$("#abNo");
 yes.disabled=no.disabled=true;msg.textContent="Daten werden gelöscht …";
 const backup=S.data;
 // Weitere Speicherungen stoppen und laufende abwarten
 S.wiped=true;saveDirty=false;clearInterval(autoSaveTimer);autoSaveTimer=null;
 if(savePromise){try{await savePromise}catch(e){}}
 saveDirty=false;
 let ok=true;
 if(backup.Datenschutz_zugestimmt){          // nur wenn überhaupt etwas gespeichert wurde
  S.data={ID:backup.ID,Abbruch_Grund:"Manuell abgebrochen",Abbruch_Zeit:now()};
  ok=false;
  for(let a=0;a<=GUARD.SAVE_RETRIES&&!ok;a++){
   try{
    const r=await fetch(SAVE_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:makeSaveBody()});
    if(!r.ok)throw new Error("HTTP "+r.status);
    ok=true;
   }catch(e){console.error(e);await new Promise(x=>setTimeout(x,1500*(a+1)))}
  }
 }
 if(!ok){
  // Löschen fehlgeschlagen: Zustand wiederherstellen, Teilnehmende können erneut versuchen oder weitermachen
  S.data=backup;S.wiped=false;saveDirty=true;startAutoSave();
  msg.innerHTML="<b style='color:var(--error)'>Die Daten konnten nicht gelöscht werden.</b><br>Bitte prüfe deine Internetverbindung und versuche es erneut.";
  yes.disabled=no.disabled=false;return;
 }
 S.aborted=S.finished=true;clearInterval(S.timer);S.enter=null;S.cur=null;
 ovHide();m.remove();abortBtn.remove();
 try{if(document.fullscreenElement)await document.exitFullscreen()}catch(e){}
 card.className="";
 card.innerHTML="<h1 style='margin:auto;text-align:center'>Die Studie wurde abgebrochen.<br><span style='font-size:16px;font-weight:400;color:var(--muted)'>Deine Daten wurden gelöscht. Du kannst dieses Fenster jetzt schließen.</span></h1>";
}

// Vollbild muss durch eine bewusste Nutzeraktion gestartet werden.
const gate=document.createElement("div");gate.id="fullscreenGate";
gate.innerHTML=`<div><h1>Studie im Vollbild starten</h1><p>Für die bestmögliche Darstellung wird die Studie im Vollbild geöffnet. Klicke auf „Studie starten“, um fortzufahren.</p><button class="btn" id="fullscreenStart">Studie starten</button><p style="font-size:13px;margin-bottom:0">Du kannst den Vollbildmodus jederzeit mit Esc verlassen.</p></div>`;
document.body.appendChild(gate);
const gateMsg=document.createElement("p");gateMsg.style.cssText="color:#b00020;font-weight:600;margin:0 0 18px";$("#fullscreenStart").before(gateMsg);
function gateEnv(){const e=envState();gateMsg.textContent=e=="mobile"?"Diese Studie kann nur an einem Computer (Laptop oder Desktop) bearbeitet werden, nicht am Handy oder Tablet. Bitte öffne diesen Link an einem Computer.":e=="small"?"Das Browserfenster ist zu klein. Bitte vergrößere das Fenster (mindestens "+GUARD.MIN_WIDTH+" × "+GUARD.MIN_HEIGHT+" Pixel) bzw. nutze den Vollbildmodus.":"";$("#fullscreenStart").disabled=!!e}
gateEnv();window.addEventListener("resize",gateEnv);
$("#fullscreenStart").addEventListener("click",async()=>{
  if(envState())return gateEnv();
  try{if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();S.fsOk=!!document.fullscreenElement}}catch(e){/* Browser verweigert Vollbild: Studie trotzdem starten */}
  window.removeEventListener("resize",gateEnv);gate.remove();goto(0,false);
});
</script>
